<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emirate Watch</title>

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <style>
      :root {
        --text: #fff;
        --muted: rgba(255, 255, 255, 0.75);

        /* glass */
        --glass: rgba(18, 18, 20, 0.35);
        --glassHover: rgba(18, 18, 20, 0.48);
        --stroke: rgba(255, 255, 255, 0.14);

        --shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* Video background */
      .bg {
        position: fixed;
        inset: 0;
        z-index: -2;
        background: #000;
      }
      .bg video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        filter: saturate(1.05) contrast(1.05);
      }
      .overlay {
        position: fixed;
        inset: 0;
        z-index: -1;
        background: radial-gradient(
          ellipse at top,
          rgba(0, 0, 0, 0.25),
          rgba(0, 0, 0, 0.82)
        );
      }

      /* Layout */
      .wrap {
        max-width: 420px;
        margin: 0 auto;
        padding: 24px 14px 34px;
        min-height: 100vh;
        display: flex;
        align-items: center;
      }

      /* Card (glass) */
      .card {
        width: 100%;
        background: rgba(15, 15, 16, 0.50);
        border: 1px solid var(--stroke);
        border-radius: 18px;
        padding: 20px 18px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow: var(--shadow);

        position: relative;
        overflow: hidden;
      }

      /* Luxury highlight on card */
      .card::before {
        content: "";
        position: absolute;
        inset: -2px;
        border-radius: 18px;
        background: linear-gradient(
          135deg,
          rgba(255,255,255,.12),
          rgba(255,255,255,0) 38%,
          rgba(255,255,255,.07) 62%,
          rgba(255,255,255,0)
        );
        pointer-events: none;
        opacity: .55;
      }

      .profile {
        text-align: center;
        margin-bottom: 14px;
      }

      .avatar {
        width: 90px;
        height: 90px;
        border-radius: 999px;
        border: 3px solid rgba(255, 255, 255, 0.85);
        object-fit: cover;
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin: 12px 0 6px;
        font-size: 22px;
        letter-spacing: 0.8px;
      }

      .bio {
        margin: 0;
        color: var(--muted);
        font-size: 13.5px;
        line-height: 1.35;
        letter-spacing: 0.2px;
      }

      /* Links */
      .links {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 16px;
        
      }

      /* Glass buttons */
      a.btn {
        position: relative;
        overflow: hidden;

        display: flex;
        align-items: center;
        justify-content: center; /* текст по центру */

        text-decoration: none;
        color: #fff;

        background: var(--glass);
        border: 1px solid rgba(255, 255, 255, 0.16);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);

        padding: 14px 14px;
        border-radius: 14px;
        font-weight: 700;

        letter-spacing: 0.8px; /* не 2px, иначе “криво” */
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.28);

        transition: 0.18s transform, 0.18s background, 0.18s box-shadow;
      }

      a.btn:hover {
        background: var(--glassHover);
        transform: translateY(-1px);
        box-shadow: 0 14px 28px rgba(0, 0, 0, 0.38);
      }

      /* Icon left, text centered */
      a.btn i {
        margin-right: 10px;
        font-size: 22px;
        width: 22px;
        text-align: center;
      }

      /* Brand colors for icons */
      .fa-instagram { color: #E4405F; } /* Instagram */
      .fa-telegram  { color: #2AABEE; } /* Telegram */
      .fa-whatsapp  { color: #25D366; } /* WhatsApp */
      .fa-envelope  { color: rgba(255,255,255,.92); }
      .fa-globe     { color: rgba(255,255,255,.92); }

      /* Shine animation on buttons */
      a.btn::before {
        content: "";
        position: absolute;
        top: -45%;
        left: -70%;
        width: 55%;
        height: 190%;
        background: linear-gradient(
          120deg,
          rgba(255,255,255,0) 0%,
          rgba(255,255,255,.18) 35%,
          rgba(255,255,255,.08) 55%,
          rgba(255,255,255,0) 100%
        );
        transform: rotate(18deg);
        opacity: 0.0;
        pointer-events: none;
        animation: shine 3.1s ease-in-out infinite;
      }

      @keyframes shine {
        0%   { transform: translateX(-160%) rotate(18deg); opacity: 0; }
        12%  { opacity: .85; }
        30%  { transform: translateX(280%) rotate(18deg); opacity: 0; }
        100% { transform: translateX(280%) rotate(18deg); opacity: 0; }
      }

      /* Optional: reduce motion for accessibility */
      @media (prefers-reduced-motion: reduce) {
        a.btn::before { animation: none; }
        a.btn { transition: none; }
      }
    </style>
  </head>

  <body>
    <div class="bg">
      <video autoplay muted loop playsinline preload="auto" poster="assets/poster.jpg">
        <source src="assets/bg.mp4" type="video/mp4" />
      </video>
    </div>
    <div class="overlay"></div>

    <div class="wrap">
      <div class="card">
        <div class="profile">

          <h1>Emirate Watch</h1>

            Гарантия на всю продукцию от 3 до 8 лет ✅<br />
            Доставка по всему Узбекистану 🌍<br />
            Высокое качество💯
          </p>
        </div>

        <div class="links">
          <a class="btn"
             href="https://www.instagram.com/emirate.watch?igsh=MXRjdm5qendocnExdA=="
             target="_blank" rel="noreferrer">
            <i class="fa-brands fa-instagram"></i> Instagram
          </a>

          <a class="btn"
             href="https://t.me/wtcuzbekistan1"
             target="_blank" rel="noreferrer">
            <i class="fa-brands fa-telegram"></i> Telegram
          </a>

          <a class="btn"
             href="https://wa.me/998901234567"
             target="_blank" rel="noreferrer">
            <i class="fa-brands fa-whatsapp"></i> WhatsApp
          </a>

          <a class="btn" href="mailto:you@mail.com">
            <i class="fa-regular fa-envelope"></i> Email
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
